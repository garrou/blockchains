<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ξ Ethereum Explorer</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ethereum.css">
</head>

<body>
  <header class="top">
    <h1>Ξ Explorer</h1>
    <nav class="chains" aria-label="Blockchain">
      <a href="index.html">₿ Bitcoin</a>
      <a href="ethereum.html" aria-current="page">Ξ Ethereum</a>
      <a href="solana.html">◎ Solana</a>
    </nav>
    <form id="search" autocomplete="off">
      <input id="q" type="search" placeholder="Block, tx hash, address or .eth name" aria-label="Search">
      <button type="submit">Search</button>
    </form>
    <span id="status" class="pill off">offline</span>
  </header>

  <main>
    <section class="stats" aria-label="Ethereum network">
      <div class="stat" title="The base fee is burned. It moves by at most 12.5% per block, up when blocks are more than half full">
        <span class="k">Base fee</span>
        <b id="st-base">—</b>
        <small id="st-base-sub">next block</small>
      </div>
      <div class="stat" title="Gas used by the last block, out of its gas limit">
        <span class="k">Gas used</span>
        <b id="st-util">—</b>
        <small id="st-util-sub">&nbsp;</small>
        <i class="bar target"><u id="st-util-bar"></u></i>
      </div>
      <div class="stat" title="ETH destroyed by the base fee (EIP-1559)">
        <span class="k">Burned</span>
        <b id="st-burn">—</b>
        <small id="st-burn-sub">&nbsp;</small>
      </div>
      <div class="stat" title="The latest finalized block cannot be reverted">
        <span class="k">Finalized</span>
        <b id="st-final">—</b>
        <small id="st-final-sub">&nbsp;</small>
      </div>
    </section>

    <section class="stage">
      <div class="hud hud-top">
        <div class="hud-title"><b id="hud-title">Block</b> <span id="hud-sub" class="muted"></span></div>
        <div class="hud-actions">
          <label><input type="checkbox" id="follow" checked> Follow block</label>
          <label title="Tower order (first layout only when Stable)">Order
            <select id="order" aria-label="Tower order">
              <option value="txid">Txid</option>
              <option value="api">Block order</option>
              <option value="size">Size</option>
            </select>
          </label>
          <label title="Next block: Stable keeps towers in place, Compact repacks them">Placement
            <select id="placement" aria-label="Next block placement">
              <option value="stable">Stable</option>
              <option value="compact">Compact</option>
            </select>
          </label>
          <button id="hud-details" type="button">Block details</button>
        </div>
      </div>
      <div id="scene">
        <div id="tip3d" class="tooltip" hidden></div>
        <div id="scene-msg" class="scene-msg"></div>
      </div>
      <div class="hud hud-bottom">
        <div class="legend" aria-label="Gas price scale, gwei">
          <div class="legend-scale"><i id="legend-bar"></i><span id="legend-ticks"></span></div>
          <span id="legend-max"></span>
        </div>
        <small class="muted">area = gas used · height &amp; color = gas price (gwei) · click = details</small>
      </div>
    </section>

    <section>
      <h2>Blocks <small>click = 3D view · double-click = details</small></h2>
      <div class="chain-wrap">
        <button type="button" class="nav nav-prev" aria-label="Newer blocks"><svg viewBox="0 0 24 24" width="20"
            height="20" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg></button>
        <div class="chain">
          <div id="upcoming" class="row"></div>
          <div class="tip" title="Latest block"></div>
          <div id="blocks" class="row"></div>
          <button type="button" id="more-blocks" class="block more" hidden></button>
        </div>
        <button type="button" class="nav nav-next" aria-label="Older blocks"><svg viewBox="0 0 24 24" width="20"
            height="20" aria-hidden="true">
            <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg></button>
      </div>
    </section>

    <section>
      <h2 class="feed-head">Recent transactions <small id="txcount" title="Received by this page (a sample of the mempool), not the network rate"></small>
        <label class="pause"><input type="checkbox" id="pause"> Pause</label>
      </h2>
      <ul id="txs" class="txs js-scroll"></ul>
    </section>
  </main>

  <dialog id="detail" tabindex="-1">
    <button id="close" aria-label="Close">✕</button>
    <div id="detail-body" class="js-scroll"></div>
  </dialog>

  <!-- Three.js r147 as classic scripts: works when double-clicked (file://) as well as on a static host -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
  <script defer
    src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <!-- pure logic: no DOM, no network -->
  <script defer src="js/core/config.js"></script>
  <!-- the chain the page works with: its numbers and words, read by the engine files below (js/core/chain.js is the contract) -->
  <script defer src="js/core/chain.js"></script>
  <script defer src="js/chains/ethereum/chain.js"></script>
  <script defer src="js/core/format.js"></script>
  <script defer src="js/chains/ethereum/core/format.js"></script>
  <script defer src="js/chains/ethereum/core/keccak.js"></script>
  <script defer src="js/chains/ethereum/core/blocks.js"></script>
  <script defer src="js/chains/ethereum/core/txs.js"></script>
  <script defer src="js/chains/ethereum/core/mempool.js"></script>
  <script defer src="js/chains/ethereum/core/projection.js"></script>
  <script defer src="js/chains/ethereum/core/address.js"></script>
  <script defer src="js/chains/ethereum/core/search.js"></script>
  <script defer src="js/chains/ethereum/core/abi.js"></script>
  <script defer src="js/core/colors.js"></script>
  <script defer src="js/core/treemap.js"></script>
  <script defer src="js/core/blocks.js"></script>
  <script defer src="js/core/feed.js"></script>
  <!-- data sources -->
  <script defer src="js/net/jsonrpc.js"></script>
  <script defer src="js/chains/ethereum/data/rpc.js"></script>
  <script defer src="js/chains/ethereum/data/blocks.js"></script>
  <script defer src="js/chains/ethereum/data/live.js"></script>
  <!-- state -->
  <script defer src="js/state/store.js"></script>
  <!-- 3D view -->
  <script defer src="js/scene/scene3d.js"></script>
  <!-- DOM views -->
  <script defer src="js/ui/dom.js"></script>
  <script defer src="js/ui/scroll.js"></script>
  <script defer src="js/ui/blocks-row.js"></script>
  <script defer src="js/ui/hud.js"></script>
  <script defer src="js/ui/dialog.js"></script>
  <script defer src="js/chains/ethereum/ui/detail.js"></script>
  <script defer src="js/ui/feed.js"></script>
  <script defer src="js/chains/ethereum/ui/stats-bar.js"></script>
  <!-- orchestration -->
  <script defer src="js/controllers/scene-sync.js"></script>
  <script defer src="js/controllers/requests.js"></script>
  <script defer src="js/controllers/navigation.js"></script>
  <script defer src="js/chains/ethereum/controllers/details.js"></script>
  <script defer src="js/chains/ethereum/controllers/search.js"></script>
  <script defer src="js/controllers/feed.js"></script>
  <script defer src="js/chains/ethereum/controllers/stats.js"></script>
  <!-- entry point -->
  <script defer src="js/app.js"></script>
</body>

</html>
